# l8collector-admission: was Deployment, now StatefulSet with volumeClaimTemplates + TLS secret
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: l8collector-admission
  namespace: probler
spec:
  serviceName: l8collector-admission
  replicas: 1
  selector:
    matchLabels:
      app: l8collector-admission
  template:
    metadata:
      labels:
        app: l8collector-admission
    spec:
      serviceAccountName: l8collector-admission
      initContainers:
        # Wait for the vnet on this node before starting: services connect to
        # $NODE_IP and panic if the vnet does not answer their first requests.
        # The extra sleep lets a vnet that just opened its port finish starting.
        - name: wait-for-vnet
          image: registry.layer-8.dev:44443/probler/probler-admission:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - for p in 26000; do until nc -z -w 2 "$NODE_IP" "$p"; do echo "waiting for vnet $NODE_IP:$p"; sleep 2; done; done; sleep 10
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
      containers:
        - name: admission
          image: registry.layer-8.dev:44443/probler/probler-admission:latest
          imagePullPolicy: Always
          env:
            - name: ClusterName
              value: Home
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: ADMISSION_HOST
              value: 0.0.0.0
            - name: ADMISSION_PORT
              value: "8443"
            - name: ADMISSION_PATH
              value: /admission/kubernetes
            - name: ADMISSION_CERT_NAME
              value: /data/admission
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          volumeMounts:
            - name: hdata
              mountPath: /data
            - name: tls
              mountPath: /data/admission
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: l8collector-admission-tls
  volumeClaimTemplates:
    - metadata:
        name: hdata
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: standard
        resources:
