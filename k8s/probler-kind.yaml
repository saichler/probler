---

# probler-parser: 6 replicas for KIND
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: probler
  name: probler-parser
  labels:
    app: probler-parser
spec:
  serviceName: probler-parser
  replicas: 1
  selector:
    matchLabels:
      app: probler-parser
  template:
    metadata:
      labels:
        app: probler-parser
    spec:
      initContainers:
        # Wait for the vnet on this node before starting: services connect to
        # $NODE_IP and panic if the vnet does not answer their first requests.
        # The extra sleep lets a vnet that just opened its port finish starting.
        - name: wait-for-vnet
          image: registry.layer-8.dev:44443/probler/probler-parser:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - for p in 26000; do until nc -z -w 2 "$NODE_IP" "$p"; do echo "waiting for vnet $NODE_IP:$p"; sleep 2; done; done; sleep 10
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
      containers:
        - name: probler-parser
          image: registry.layer-8.dev:44443/probler/probler-parser:latest
          imagePullPolicy: Always
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: hdata
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: standard
        resources:
          requests:
            storage: 2Gi

