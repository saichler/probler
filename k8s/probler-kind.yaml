# KIND cluster version — uses KIND's built-in standard StorageClass
# KIND ships with rancher/local-path-provisioner pre-installed as StorageClass "standard"
# No custom StorageClass definition needed.
#
# Usage:
#   kind create cluster --config kind-cluster.yaml
#   kubectl apply -f probler-kind.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: probler
  labels:
    name: probler

---

# probler-vnet: was DaemonSet, now StatefulSet with anti-affinity for one-per-node
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: probler
  name: probler-vnet
  labels:
    app: probler-vnet
spec:
  serviceName: probler-vnet
  replicas: 1
  selector:
    matchLabels:
      app: probler-vnet
  template:
    metadata:
      labels:
        app: probler-vnet
    spec:
      hostNetwork: true
      containers:
        - name: probler-vnet
          image: registry.layer-8.dev:44443/probler/probler-vnet:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 25998
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: hdata
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi

---

